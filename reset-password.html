<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinPerson — Reset your password</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F2EFE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1524" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="logo" href="index.html" style="text-decoration:none;color:inherit;">FinPerson</a>
  </div>
</header>

<main class="wrap dash" id="main" style="max-width:440px;">
  <h1 style="font-family:var(--font-display);font-weight:500;">Reset your password</h1>
  <p class="lede" style="font-size:15px;" id="reset-intro">Choose a new password for your account.</p>

  <div id="reset-form">
    <input class="email-input" id="rp-pass" type="password" placeholder="New password (8+ characters)" autocomplete="new-password">
    <input class="email-input" id="rp-pass2" type="password" placeholder="Confirm new password" autocomplete="new-password">
    <p class="email-error" id="rp-error" hidden></p>
    <button class="btn btn-primary email-submit" id="rp-submit" type="button">Set new password</button>
  </div>

  <div id="reset-done" hidden>
    <p class="email-success" style="font-size:14.5px;">Your password has been updated. <a href="index.html">Head back to FinPerson &rarr;</a></p>
  </div>

  <div id="reset-invalid" hidden>
    <p class="email-error" style="font-size:14.5px;">This reset link is invalid or has expired. <button class="linkish" id="reset-retry-btn" type="button">Request a new one</button></p>
  </div>
</main>

<footer class="footer">
  <div class="wrap footer-legal">
    <p><strong>Not financial advice.</strong> This is an educational practice tool.</p>
    <p class="footer-copy">&copy; <span id="year">2026</span> FinPerson.</p>
  </div>
</footer>

<script src="instruments.js"></script>
<script src="data.js"></script>
<script src="api.js"></script>
<script src="ui.js"></script>
<script src="reset-password.js"></script>
</body>
</html>
