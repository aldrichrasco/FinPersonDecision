name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check every JS file parses
        run: |
          status=0
          for f in $(find . -name "*.js" -not -path "./.git/*" -not -path "./.venv/*" -not -path "./.agents/*" -not -path "./node_modules/*"); do
            node --check "$f" || status=1
          done
          exit $status
      - name: Run frontend unit tests
        run: npm test
